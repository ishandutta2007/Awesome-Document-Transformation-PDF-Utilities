<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    /* Dynamic pulsing ambient orbs */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.7; }
      50% { transform: translate(30px, -20px) scale(1.15); opacity: 1; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.6; }
      50% { transform: translate(-25px, 25px) scale(1.2); opacity: 0.9; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-1 { animation: pulseOrb1 9s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb2 11s ease-in-out infinite; }
    .pill-float-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill2 6s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8 6; animation: flowLine 15s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Background Glowing Orbs (Kept safely in background) -->
  <g filter="url(#blurFilter)">
    <circle class="orb-1" cx="220" cy="90" r="140" fill="url(#glowGrad1)" />
    <circle class="orb-2" cx="980" cy="270" r="160" fill="url(#glowGrad2)" />
  </g>

  <!-- Dynamic Ambient Stream Lines in background -->
  <path class="stream-line" d="M -50 180 Q 300 70 600 180 T 1250 180" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.35" />
  <path class="stream-line" d="M -50 220 Q 300 310 600 210 T 1250 200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Floating Feature Badges (Pills) safely at bottom flanks, never overlapping main title -->
  <g class="pill-float-1">
    <rect x="80" y="275" width="165" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="98" cy="292" r="4" fill="#38bdf8" />
    <text x="110" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ OCR &amp; AI Extraction</text>
  </g>

  <g class="pill-float-2">
    <rect x="260" y="275" width="160" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="278" cy="292" r="4" fill="#818cf8" />
    <text x="290" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🔄 HTML / MD to PDF</text>
  </g>

  <g class="pill-float-1">
    <rect x="780" y="275" width="165" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="798" cy="292" r="4" fill="#a855f7" />
    <text x="810" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🛡️ Self-Hosted &amp; Privacy</text>
  </g>

  <g class="pill-float-2">
    <rect x="960" y="275" width="160" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="978" cy="292" r="4" fill="#38bdf8" />
    <text x="990" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📊 Cloud SaaS Suites</text>
  </g>

  <!-- Central Foreground Content - Highly Legible & Crisp -->
  <g id="foreground-content">
    <!-- Top Pill Tag -->
    <rect x="490" y="42" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="600" y="61" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#38bdf8">CURATED AWESOME LIST</text>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5" filter="url(#glow)">
      Document Transformation
    </text>
    <text x="600" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      &amp; PDF Utilities
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Top Cloud SaaS Suites, Self-Hosted Docker Tools, OCR Engines &amp; Developer Libraries
    </text>
  </g>
</svg>